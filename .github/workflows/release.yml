name: Release
# On a version tag: test and build with a read-only token, then make the GitHub release (the version's CHANGELOG
# section, with the wheel and the source archive) and move the major tag (v0, v1, ...) to it, so that
# `uvx --from git+https://github.com/zch6a/table-trace@v0` gets the latest release of that major version. The job
# with write access runs nothing of the project: only gh. Actions pinned to commits.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
      - name: The tag is the package version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "$GITHUB_REF_NAME"
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release, and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="v${version%%.*}"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --title "table-trace $version" \
              --notes-file dist/notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)"
          # An annotated tag points to a tag object, a plain tag to the commit: the major tag goes to the commit.
          commit="$sha"
          if [ "$type" = "tag" ]; then
            commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"
          fi
          case "$commit" in *[!0-9a-f]* | "") echo "not a commit: $commit" >&2; exit 1 ;; esac
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$commit" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$commit" > /dev/null
          fi
          echo "released $GITHUB_REF_NAME; $major now points to ${commit:0:7}"
